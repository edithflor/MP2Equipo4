[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dataset-quality"
version = "0.1.0"
description = "Pipeline reproducible de calidad y versionado para datasets COCO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "fastapi>=0.116",
  "minio>=7.2",
  "pydantic-settings>=2.10",
  "pymysql>=1.1",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
  "dvc[s3]>=3.63",
  "pytest>=8.4",
  "pytest-bdd>=8,<9",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_quality"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
