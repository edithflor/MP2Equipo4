name: dataset-quality

services:
  mariadb:
    image: mariadb:11.4@sha256:80494b9810694179889f7281ec44ca928241df577159c0356a1070e2e94616a1
    environment:
      MARIADB_DATABASE: ${DB_NAME:-dataset_quality}
      MARIADB_USER: ${DB_USER:-dataset_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_password}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  minio:
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-dataset_quality}
      DB_USER: ${DB_USER:-dataset_app}
      DB_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_SECURE: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-dataset-dev}
    ports:
      - "8000:8000"
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mariadb_data:
  minio_data:
